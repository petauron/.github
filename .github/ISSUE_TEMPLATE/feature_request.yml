name: Feature Request
description: Suggest an improvement for a Petauron project.
title: "[Feature]: "
body:
  - type: textarea
    id: problem-or-motivation
    attributes:
      label: Problem or motivation
      description: What problem would this solve, or what motivates the request?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the outcome you would like to see.
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternatives you have considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, links, mockups, or other helpful context.
